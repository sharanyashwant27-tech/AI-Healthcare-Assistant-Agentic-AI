apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ai-healthcare-backend:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-healthcare-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-healthcare
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
