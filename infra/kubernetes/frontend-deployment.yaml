apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ai-healthcare-frontend:1.0.0
          ports:
            - containerPort: 8911
          env:
            - name: PORT
              value: "8911"
            - name: NEXT_PUBLIC_API_URL
              value: http://backend:8000/api/v1
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-healthcare
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 8911
      targetPort: 8911
